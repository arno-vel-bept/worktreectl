name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Zsh for shell integration tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes zsh
      - name: Test in an isolated process namespace
        # Match CI's fail-closed process discovery without unrelated host services.
        run: |
          sudo unshare --pid --fork --mount-proc \
            setpriv --reuid="$(id -u)" --regid="$(id -g)" --init-groups \
            env HOME="$HOME" PATH="$PATH" \
            go test -race ./...
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
