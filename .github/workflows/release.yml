name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Zsh for shell integration tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes zsh
      - name: Test in an isolated process namespace
        # Match CI's fail-closed process discovery without unrelated host services.
        run: |
          sudo unshare --pid --fork --mount-proc \
            setpriv --reuid="$(id -u)" --regid="$(id -g)" --init-groups \
            env HOME="$HOME" PATH="$PATH" \
            go test -race ./...
      - name: Check for an already published release
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # GitHub can emit a tag-push event when a manual release creates its tag.
        # Do not rebuild/replace assets after that verified release is public.
        run: |
          published="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            | jq -s --arg tag "$GITHUB_REF_NAME" 'any(.[][]; .tag_name == $tag and .draft == false)')"
          echo "published=$published" >> "$GITHUB_OUTPUT"
      - uses: goreleaser/goreleaser-action@v7
        if: steps.existing.outputs.published != 'true'
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
