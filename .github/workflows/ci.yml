name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Zsh for Linux integration tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes zsh
      - run: go vet ./...
      - name: Test on macOS
        if: runner.os == 'macOS'
        run: go test -race -cover ./...
      - name: Test on Linux in an isolated process namespace
        if: runner.os == 'Linux'
        # Host services may have unreadable same-user /proc entries. Keep
        # fail-closed discovery intact; isolate tests, then drop privileges.
        run: |
          sudo unshare --pid --fork --mount-proc \
            setpriv --reuid="$(id -u)" --regid="$(id -g)" --init-groups \
            env HOME="$HOME" PATH="$PATH" \
            go test -race -cover ./...
      - run: test -z "$(gofmt -l cmd internal)"
      - run: sh -n install.sh
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: check
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck install.sh
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
